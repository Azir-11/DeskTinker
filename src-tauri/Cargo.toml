[package]
name = "hostguard"
version = "0.2.0"
description = "HostGuard — manage hosts, shell config and system stats"
authors = ["Azir <alessandradiel743@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hostguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
# 应用内更新：updater 从 GitHub Releases 的 latest.json 检查并安装签名更新；
# process 提供安装后 relaunch() 重启进入新版本。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
# System telemetry. `default-features = false` 精选所需采集器：system（CPU/内存/负载，
# 并按 PID 查询端口占用进程详情）、disk（磁盘占用）、component（温度，尽力而为，
# Windows 走 WMI 可能为空）。无 network。
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "component"] }
# SSL 证书申请（ACME）：certon 负责 Let's Encrypt 订单/授权/签发，ring 后端避免
# aws-lc 的 CMake 构建依赖；hickory-resolver 用于手动 DNS-01 的多解析器测试。
certon = { version = "0.2", default-features = false, features = ["ring"] }
hickory-resolver = "0.26"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["io-util", "process"] }
libc = "0.2"
portable-pty = "0.9"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSBundle",
  "NSProcessInfo",
  "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
